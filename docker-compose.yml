services:
  bot-dev:
    build: .
    container_name: road-biking-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_ENV: development
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      PHOTO_CONTEST_DB_PATH: /data/photo-contest.db
      SUBMISSION_COOLDOWN_EXEMPT_USER_IDS: ${SUBMISSION_COOLDOWN_EXEMPT_USER_IDS:-}
      END_NOW_ALLOWED_USER_IDS: ${END_NOW_ALLOWED_USER_IDS:-}
      END_NOW_DM_USER_IDS: ${END_NOW_DM_USER_IDS:-}
      END_NOW_SEND_TEST_USER_ID: ${END_NOW_SEND_TEST_USER_ID:-}
      GERMAN_LOCALE_USER_ID: ${GERMAN_LOCALE_USER_ID:-}
    volumes:
      - ./data/dev-1555674814562439188:/data
